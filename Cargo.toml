[workspace]
resolver = "3"
members = [
    "crates/launchkeeper-core",
    "crates/launchkeeper-runner",
    "crates/launchkeeper-cli",
    "crates/launchkeeper-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
launchkeeper-core = { path = "crates/launchkeeper-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
signal-hook = { version = "0.3", default-features = false }
specta = "2.0.0-rc.25"
assert_cmd = "2"
predicates = "3"
# M4 §1 (AI task insight). `reqwest`'s blocking client with rustls only —
# no `default-tls`/native-tls, so nothing links against the system OpenSSL.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
sha2 = "0.10"
# Pinned to 3.x: 4.x needs rust-version 1.88, above this workspace's 1.85.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
