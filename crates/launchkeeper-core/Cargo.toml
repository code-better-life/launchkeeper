[package]
name = "launchkeeper-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core library for Launchkeeper: task model, plist generation, launchctl wrapper, SQLite storage"

[features]
default = []
# Derives `specta::Type` on the types the Tauri app exposes to TypeScript.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
plist.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
dirs.workspace = true
chrono.workspace = true
specta = { workspace = true, optional = true }
reqwest.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true
